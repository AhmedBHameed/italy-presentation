<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not found — Discover Italy</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/css/styles.css">
<script>
  (() => {
    const saved = localStorage.getItem('italy-theme');
    const system = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.dataset.theme = saved || system;
  })();
</script>
</head>
<body>
<div style="min-height:100vh;display:grid;place-items:center;text-align:center;padding:40px">
  <div>
    <div class="eyebrow">Error 404</div>
    <h1 style="font-family:var(--serif);font-size:clamp(60px,14vw,140px);line-height:1;margin:10px 0 18px;
               padding-bottom:.08em;
               background:linear-gradient(160deg,var(--text),var(--gold) 60%,var(--terracotta));
               -webkit-background-clip:text;background-clip:text;color:transparent">Perduto</h1>
    <p style="color:var(--text-dim);max-width:420px;margin:0 auto 30px">
      This road doesn’t lead to Rome. Nothing lives at that address.
    </p>
    <a class="btn btn-primary" href="/">← Back to Italy</a>
  </div>
</div>
</body>
</html>
